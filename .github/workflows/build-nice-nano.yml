name: Build nice!nano Firmware & Deploy Web Configurator

on:
  push:
    branches:
      - password_protection
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-nice-nano:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.29.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache nRF Connect SDK
        uses: actions/cache@v4
        with:
          path: |
            firmware-bluetooth/sdk
            firmware-bluetooth/.west
          key: nrf-sdk-${{ hashFiles('firmware-bluetooth/build.sh') }}

      - name: Build nice!nano firmware
        working-directory: firmware-bluetooth
        run: ./build.sh nice_nano

      - name: Upload nice!nano UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: remapper-nice-nano-uf2
          path: firmware-bluetooth/artifacts/remapper_nice_nano.uf2
          if-no-files-found: error

  deploy-web-configurator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: config-tool-web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
